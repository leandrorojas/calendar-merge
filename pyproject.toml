[project]
name = "calendar-merge"
version = "0.1.16"
requires-python = ">=3.12"
dependencies = [
    # Imported directly by merge.py for the interactive 2FA prompts. It used to
    # arrive transitively via pyicloud, which dropped it in 2.6.5 -- so the import
    # only worked by accident and must be declared here.
    "click>=8.4.2",
    "dotenv>=0.9.9",
    # Imported directly by merge.py to expand RRULEs. It arrives transitively via
    # icalendar today, which is exactly how click arrived via pyicloud until it did
    # not -- so it is declared rather than relied upon.
    "python-dateutil>=2.9",
    "icalendar>=7.2.2",
    "pyfangs",
    "pyicloud==2.6.5",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Enable common, high-signal rule sets.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter where possible)
    "B008",   # function call in argument default (common pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# tools/ is on the path so tests can import the CI checks without touching sys.path.
pythonpath = ["src", "tools"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# merge.py is fully covered; keep it that way.
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
# Start lenient; tighten later.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
# Tests often don't need strict typing.
disallow_untyped_defs = false

# 🔑 Tell Hatch to include your single module.
# sources strips the leading src/ so the wheel gets merge.py at its root.
# Without it the module installs as src/merge.py -- src is not a package, so
# the calendar-merge entry point cannot import merge and dies on startup.
[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src/merge.py"]

[tool.uv.sources]
pyfangs = { git = "ssh://git@github.com/leandrorojas/pyfangs", rev = "v0.7.3" }

# Optional: CLI entry point (runs merge:main)
[project.scripts]
calendar-merge = "merge:main"
