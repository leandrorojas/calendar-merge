name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs target intermediate branches, not just main,
  # and still need CI to run.
  pull_request:

# Least privilege: both jobs only read the repo. Overrides the default
# read/write GITHUB_TOKEN scope.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Exact pin matches .pre-commit-config.yaml so CI and local hooks never
      # disagree on formatting. --no-build installs from wheels only, so no
      # sdist setup script is ever executed.
      - name: Install Ruff only (no private deps needed)
        run: uv tool install --no-build "ruff==0.15.10"

      - name: Ruff lint
        run: uv tool run --no-build ruff check src/ tests/

      - name: Ruff format check
        run: uv tool run --no-build ruff format --check src/ tests/

  test-and-typecheck:
    name: Test & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up SSH for pyfangs (private dependency)
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.PYFANGS_DEPLOY_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Mypy type check
        run: uv run mypy src/ tests/

      - name: Pytest
        run: uv run pytest tests/ -v
