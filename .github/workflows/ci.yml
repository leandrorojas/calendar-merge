name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs target intermediate branches, not just main,
  # and still need CI to run.
  pull_request:

# Least privilege: both jobs only read the repo. Overrides the default
# read/write GITHUB_TOKEN scope.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Exact pin matches .pre-commit-config.yaml so CI and local hooks never
      # disagree on formatting. --no-build installs from wheels only, so no
      # sdist setup script is ever executed.
      - name: Install Ruff only (no private deps needed)
        run: uv tool install --no-build "ruff==0.16.3"

      # --from pins the version for the run itself; without it `uv tool run`
      # re-resolves ruff independently of the install step above.
      - name: Ruff lint
        run: uv tool run --no-build --from "ruff==0.16.3" ruff check src/ tests/

      - name: Ruff format check
        run: uv tool run --no-build --from "ruff==0.16.3" ruff format --check src/ tests/

      # The test suite imports merge through pytest's pythonpath = ["src"], which
      # resolves it from the source tree and never from the built artifact -- so full
      # coverage says nothing about whether an installed copy can start. A wheel that
      # shipped the module as src/merge.py went undetected for two releases.
      # Needs no private dependency: building only runs the hatchling backend.
      - name: Wheel layout
        run: |
          uv build --wheel -o dist
          python - <<'CHECK'
          import configparser, pathlib, zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          archive = zipfile.ZipFile(wheel)
          names = archive.namelist()

          entry_points = configparser.ConfigParser()
          entry_points.read_string(
              archive.read(next(n for n in names if n.endswith("entry_points.txt"))).decode()
          )
          # Derived rather than hardcoded, so renaming the entry point without moving the
          # module is caught as readily as moving the module without renaming it.
          for script, target in entry_points["console_scripts"].items():
              module = target.split(":")[0]
              expected = module.replace(".", "/") + ".py"
              assert expected in names, (
                  f"console script {script!r} imports {module!r}, "
                  f"but {expected} is not at the wheel root: {names}"
              )
              print(f"ok: {script} -> {module} ({expected})")
          CHECK

  test-and-typecheck:
    name: Test & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up SSH for pyfangs (private dependency)
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PYFANGS_DEPLOY_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # --locked fails if uv.lock is missing or stale instead of silently
      # re-resolving, so CI tests the exact dependency set that is committed.
      - name: Install dependencies
        run: uv sync --extra dev --locked

      # The deploy key is only needed to fetch pyfangs. Revoke it before running
      # any PR-authored code (mypy plugins, conftest, tests) so that code cannot
      # reach the key through SSH_AUTH_SOCK.
      - name: Revoke SSH agent before running PR code
        run: |
          ssh-add -D || true
          ssh-agent -k || true

      # The environment is already synced above, so skip the implicit sync that
      # `uv run` would otherwise perform: --no-sync avoids re-resolving,
      # --frozen keeps the committed lockfile authoritative, and --no-build
      # blocks sdist setup scripts.
      - name: Mypy type check
        run: uv run --no-sync --frozen --no-build mypy src/ tests/

      # --cov applies the coverage settings from pyproject, including
      # fail_under = 100, so a drop in coverage fails the build.
      - name: Pytest
        run: uv run --no-sync --frozen --no-build pytest tests/ -v --cov
