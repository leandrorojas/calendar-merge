version: 2

updates:
  # Python dependencies (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions. Runs as an independent job, so it is unaffected by the uv
  # ecosystem above. Its earlier failures were only because no workflow files
  # existed before 2026-08-11; ci.yml and codeql.yml now do.
  #
  # This one matters: every action is pinned to a commit SHA for security, and
  # those pins only stay current if Dependabot bumps them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
